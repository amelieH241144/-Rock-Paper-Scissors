<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Rock, Paper, Scissors</h1>
<div class="game-container">
  <div id="scoreboard">
    <p>You: <span id="user-score">0</span></p>
    <p>Computer: <span id="computer-score">0</span></p>
  </div>

  <div id="buttons">
    <button class="choice" data-move="rock">
      <img src="Rock.png" alt="Rock" class="rps-img">
    </button>
    <button class="choice" data-move="paper">
      <img src="Paper.png" alt="Paper" class="rps-img">
    </button>
    <button class="choice" data-move="scissors">
      <img src="Scissors.png" alt="Scissors" class="rps-img">
    </button>
  </div>
 <!-- Result Display -->
  <div id="result">
    <p id="user-move">Your move: </p>
    <p id="computer-move">Computer move: </p>
    <h2 id="outcome"></h2>
    <button id="reset-btn">Reset Game</button>
  </div>
   <!-- Final Result Modal -->
  <div id="final-result" style="display: none;">
    <div id="result-box">
      <h2 id="final-message"></h2>
      <button onclick="location.reload()">Play Again</button>
    </div>
  </div>
</div>
  <script src="main.js"></script>
</body>
</html>
